<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>独立ロードマップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 帳簿と見積書の体裁。1カラム、罫線で区切る表が主役。色は「黒字＝帳簿の緑」「赤字＝赤・△」だけに意味を持たせる */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#13262a; --muted:#5a6d72; --line:#d3dcda; --rule:#13262a;
  --accent:#0a6a5a; --accent-soft:#dfeeea; --red:#bf2d28; --red-soft:#fbe9e7; --amber:#8f5b00;
  --text:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --num:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1617; --surface:#162123; --ink:#e5eeec; --muted:#93a5a6; --line:#2a3a3c; --rule:#93a5a6;
  --accent:#55c7b2; --accent-soft:#15322e; --red:#ff7d73; --red-soft:#3a1b19; --amber:#e2ad4f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1617; --surface:#162123; --ink:#e5eeec; --muted:#93a5a6; --line:#2a3a3c; --rule:#93a5a6;
  --accent:#55c7b2; --accent-soft:#15322e; --red:#ff7d73; --red-soft:#3a1b19; --amber:#e2ad4f; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--rule);padding-bottom:8px}
header.top h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.04em}
#sync{font-size:11px;color:var(--muted);text-align:right}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font-size:15px;font-weight:700;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
h2 small{font-weight:400;font-size:11px;color:var(--muted)}
h3{font-size:12px;font-weight:700;margin:0;color:var(--muted);letter-spacing:.08em}
p{margin:0}
.note{font-size:12px;color:var(--muted)}
.warn{font-size:12px;color:var(--amber)}
.neg{color:var(--red)}
.pos{color:var(--accent)}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 表 */
.scroll{overflow-x:auto;min-width:0;background:var(--surface);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child>td,tr:last-child>th{border-bottom:0}
thead th{font-size:11px;font-weight:500;color:var(--muted);background:var(--bg);white-space:nowrap}
td.r,th.r{text-align:right}
td.n{font-size:13px}
tr.sub td{font-weight:700;background:var(--bg)}
tr.total td{font-weight:700;border-top:2px solid var(--rule);font-size:14px}
tr.grp td{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;padding-top:10px;padding-bottom:3px}
tr.tap{cursor:pointer}
tr.tap:active{background:var(--accent-soft)}
td button{white-space:nowrap;padding:6px 9px}
td.n,th.r{white-space:nowrap}
td .memo,td small{white-space:normal}
table.kv{table-layout:fixed}
table.kv td.n{white-space:normal;overflow-wrap:anywhere}
td .memo{display:block;font-size:11px;color:var(--muted);line-height:1.4}
table.kv th{font-weight:400;color:var(--muted);width:42%;font-size:12px}
table.kv td{text-align:right}
table.kv td small{display:block;font-size:11px;color:var(--muted);font-family:var(--text)}
table.mon td,table.mon th{padding:5px 6px;text-align:right;font-size:12px}
table.mon td:first-child,table.mon th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.mon thead th:first-child{background:var(--bg)}
table.mon tr.sub td:first-child{background:var(--bg)}
table.mon th .memo{display:block;font-size:10px}
tr.redrow td{background:var(--red-soft)}
tr.mark td{border-top:2px solid var(--accent)}

details{border-top:1px solid var(--rule)}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{font-weight:700;font-size:14px;padding:11px 0;cursor:pointer}
details>div{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;min-width:0}
/* 入力 */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f span.h{font-size:11px;line-height:1.35}
.inp{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:500 16px var(--num);padding:9px 8px;text-align:right;outline:0}
.inp input[type=text].t,.inp input[type=url],.inp input[type=month],.inp select,.inp textarea{font-family:var(--text);text-align:left}
.inp i{font-style:normal;font-size:12px;color:var(--muted);padding-right:8px;white-space:nowrap}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}
label.chk input{width:20px;height:20px;accent-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:500 13px var(--text);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer}
button:focus-visible,tr.tap:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
button.danger{color:var(--red)}
button.add{align-self:flex-start;border-style:dashed;color:var(--muted)}

/* 道のり */
ol.tl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line)}
ol.tl li{display:grid;grid-template-columns:34px 1fr;border-bottom:1px solid var(--line);position:relative}
ol.tl li:last-child{border-bottom:0}
ol.tl li::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--line)}
ol.tl li.done::before{background:var(--accent)}
.dot{position:relative;z-index:1;width:22px;height:22px;margin:11px 0 0 6px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);padding:0;display:grid;place-items:center;font-size:12px;line-height:1;color:var(--surface)}
li.done .dot{background:var(--accent);border-color:var(--accent)}
li.next .dot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
li.calc .dot{border-style:dashed;width:14px;height:14px;margin:15px 0 0 10px}
li.open .dot{border-radius:3px;border-color:var(--ink)}
.tlb{padding:8px 10px 9px 4px;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.tlb .when{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.tlb .what{font-weight:500;font-size:14px;overflow-wrap:anywhere}
li.done .what{color:var(--muted);text-decoration:line-through}
li.open .what{font-weight:700;font-size:16px}
li.calc .what{font-weight:400;font-size:13px}
li.late .when b{color:var(--red)}
.tlb .memo{font-size:11px;color:var(--muted);line-height:1.45}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:2px solid var(--rule);display:flex;flex-direction:column;gap:6px;padding:6px 0 8px;margin-bottom:-10px}
.sticky .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sticky .sum div{min-width:0;display:flex;flex-direction:column}
.sticky span{font-size:10px;color:var(--muted);line-height:1.3}
.sticky b{font:500 13px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex}
.seg button{flex:1;border-radius:0;padding:7px 8px}
.seg button:first-child{border-radius:4px 0 0 4px}
.seg button:last-child{border-radius:0 4px 4px 0;border-left:0}
/* グラフ */
.chart{background:var(--surface);border:1px solid var(--line);padding:6px 4px 2px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{font:10px var(--num);fill:var(--muted)}
#readout{font-size:12px;color:var(--muted);min-height:1.6em}

/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs a{flex:1;max-width:180px;text-align:center;padding:10px 2px 9px;font-size:12px;color:var(--muted);text-decoration:none;border-top:3px solid transparent;margin-top:-1px}
nav.tabs a b{display:block;font-size:14px;font-weight:700}
nav.tabs a.cur{color:var(--accent);border-top-color:var(--accent)}

/* 編集シート */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet .box{background:var(--bg);width:100%;max-width:720px;max-height:88%;overflow-y:auto;border-top:3px solid var(--accent);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
#sheet h2{border:0;padding:0}
#sheet .inp textarea{font-size:13px;min-height:160px;resize:vertical}
@media (prefers-reduced-motion:no-preference){ #sheet .box{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
@media (min-width:560px){ .form.w3{grid-template-columns:1fr 1fr 1fr} }
</style>

    if(r.status===409)return r.json().then(function(d){adopt(d.plan);syncMsg('サーバー側の変更を読み込みました（直前の入力は反映されていません）')});
    if(!r.ok)throw new Error(r.status);
    setBase(state.updatedAt);syncMsg('サーバーと同期済み');
  }).catch(syncFail);
}

reverse:function(C){
  if(!state.sim.autoFunds) return '';
  var P=state.pre,base=C.projected-C.accM,target=C.required-C.loan;
  var needM=C.preN>0?Math.max(0,Math.ceil((target-base)/C.preN/1000)*1000):0;
  // 今のペースで届く月
  var bal=P.savings,reach=null,now=C.now;
  var cost=function(ym,first){return sum(state.ms,function(m){return (!m.done&&m.kind!=='open'&&m.cost>0&&(first?ymN(m.ym)<=ymN(ym):m.ym===ym))?m.cost:0})};
  var lastCost=Math.max.apply(null,[0].concat(state.ms.filter(function(m){return !m.done&&m.kind!=='open'&&m.cost>0}).map(function(m){return ymDiff(now,m.ym)})));
  bal-=cost(now,true);
  for(var i=0;i<=360;i++){
    if(i>0){var ym=ymAdd(now,i),mo=+ym.slice(5,7);bal+=P.monthly;if(mo===6||mo===12)bal+=P.bonus/2;bal-=cost(ym)}
    if(i>=lastCost&&bal>=target){reach=ymAdd(now,i);break}
  }
  var rd=reach?ymDiff(C.open,reach):null;
  return '<div class="scroll"><table class="kv"><tr><th>予定月に間に合う毎月の積立</th><td class="n">'+yen(needM)+'円<small>今は '+yen(P.monthly)+'円（差 '+yen(needM-P.monthly)+'円）</small></td></tr>'+
    '<tr><th>今のペースで届く月</th><td class="n">'+(reach?ymL(reach):'<span class="neg">30年以内に届かず</span>')+'<small>'+(reach?(rd>0?'予定より'+dur(rd)+'遅れ':rd<0?'予定より'+dur(rd)+'早い':'予定どおり'):'')+'</small></td></tr></table></div>';
},

/* ---------- グラフ（SVG・外部ライブラリなし） ---------- */
function drawChart(el,C){
  var W=360,H=214,L=46,R=10,T=16,B=24,pw=W-L-R,ph=H-T-B;
  var pts=[];C.pre.forEach(function(p){pts.push({ym:p.ym,bal:p.bal})});
  var total=C.preN+C.N;
  C.rows.forEach(function(r){pts.push({ym:r.ym,bal:r.bal,m:r.m})});
  var vals=pts.map(function(p){return p.bal}).concat([C.b0,0]);
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals); if(hi-lo<1){hi=lo+1000000}
  var raw=(hi-lo)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,5,10].map(function(k){return k*mag}).filter(function(s){return s>=raw})[0];
  var y0=Math.floor(lo/step)*step,y1=Math.ceil(hi/step)*step;
  var X=function(i){return L+pw*i/total},Y=function(v){return T+ph*(1-(v-y0)/(y1-y0))};
  var path='',i;
  for(i=0;i<=C.preN;i++) path+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(pts[i].bal).toFixed(1);
  path+='L'+X(C.preN).toFixed(1)+' '+Y(C.b0).toFixed(1);
  for(i=C.preN+1;i<=total;i++) path+='L'+X(i).toFixed(1)+' '+Y(pts[i].bal).toFixed(1);
  var area=path+'L'+X(total).toFixed(1)+' '+Y(0).toFixed(1)+'L'+X(0).toFixed(1)+' '+Y(0).toFixed(1)+'Z';
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="今日から開業後までの手元資金の推移"><defs><clipPath id="cneg"><rect x="0" y="'+Y(0).toFixed(1)+'" width="'+W+'" height="'+H+'"/></clipPath><clipPath id="cpos"><rect x="0" y="0" width="'+W+'" height="'+Y(0).toFixed(1)+'"/></clipPath></defs>';
  for(var v=y0;v<=y1+1;v+=step){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="'+(v===0?0:1)+'"/><text x="'+(L-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+(v<0?'△':'')+Math.abs(Math.round(v/10000)).toLocaleString()+'万</text>'}
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--rule)" stroke-width="1"/>';
  var years=Math.ceil(total/12),every=years>8?2:1,k=0;
  for(i=0;i<=total;i++){var ym=ymAdd(C.now,i);if(ym.slice(5)==='01'){if(k%every===0&&X(i)<W-R-8)s+='<line x1="'+X(i).toFixed(1)+'" x2="'+X(i).toFixed(1)+'" y1="'+(H-B)+'" y2="'+(H-B+4)+'" stroke="var(--muted)"/><text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+ym.slice(0,4)+'</text>';k++}}
  s+='<path d="'+area+'" fill="var(--accent)" fill-opacity=".12" clip-path="url(#cpos)"/><path d="'+area+'" fill="var(--red)" fill-opacity=".14" clip-path="url(#cneg)"/>';
  s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" clip-path="url(#cpos)"/><path d="'+path+'" fill="none" stroke="var(--red)" stroke-width="2" stroke-linejoin="round" clip-path="url(#cneg)"/>';
  var ox=X(C.preN),anchor=ox>W-60?'end':(ox<L+30?'start':'middle');
  s+='<line x1="'+ox.toFixed(1)+'" x2="'+ox.toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--ink)" stroke-dasharray="3 3"/><text x="'+ox.toFixed(1)+'" y="'+(T-5)+'" text-anchor="'+anchor+'" style="fill:var(--ink);font-family:var(--text);font-weight:700">開業</text>';
  state.ms.forEach(function(m){var d=ymDiff(C.now,m.ym);if(m.kind!=='open'&&!m.done&&d>=0&&d<=C.preN)s+='<circle cx="'+X(d).toFixed(1)+'" cy="'+Y(pts[d].bal).toFixed(1)+'" r="2.6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>'});
  state.staff.forEach(function(st){if(st.on&&st.start<=C.N){var d=C.preN+st.start;s+='<circle cx="'+X(d).toFixed(1)+'" cy="'+Y(pts[d].bal).toFixed(1)+'" r="3" fill="var(--ink)"/>'}});
  var e=pts[total];
  s+='<circle cx="'+X(total).toFixed(1)+'" cy="'+Y(e.bal).toFixed(1)+'" r="3.5" fill="'+(e.bal<0?'var(--red)':'var(--accent)')+'"/>';
  s+='<line id="cur" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1" visibility="hidden"/></svg>';
  el.innerHTML=s;
  var svg=el.firstChild,cur=$('#cur',svg),ro=$('#readout');
  var move=function(ev){
    var r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(total,Math.round((px-L)/pw*total))),p=pts[i];
    cur.setAttribute('x1',X(i));cur.setAttribute('x2',X(i));cur.setAttribute('visibility','visible');
    ro.innerHTML='<b>'+ymL(i<=C.preN?p.ym:ymAdd(p.ym,0))+'</b>'+(i>C.preN?'（開業'+p.m+'か月目の月末）':i===C.preN?'（開業費用の支払い前）':'')+'　残高 <span class="n'+cls(p.bal)+'">'+yen(p.bal)+'円</span>';
  };
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
}

var sheetCtx=null;
function openSheet(o){
  sheetCtx=o;

  o.fields.forEach(function(f){
    var v=o.value[f.k],id='f_'+f.k;
    if(f.t==='chk') h+='<label class="chk full"><input type="checkbox" id="'+id+'"'+(v?' checked':'')+'>'+f.l+'</label>';
    else if(f.t==='area') h+='<label class="f full" for="'+id+'">'+f.l+'<span class="inp"><textarea id="'+id+'" readonly>'+esc(v)+'</textarea></span></label>';
    else h+='<label class="f'+(f.full?' full':'')+'" for="'+id+'">'+f.l+'<span class="inp"><input id="'+id+'" '+(f.t==='ym'?'type="month"':f.t==='text'?'type="text" class="t"':'type="text" inputmode="'+(f.t==='dec'?'decimal':'numeric')+'"')+' value="'+esc(f.t==='yen'?yen(v):v)+'" autocomplete="off">'+(f.u?'<i>'+f.u+'</i>':'')+'</span>'+(f.h?'<span class="h">'+f.h+'</span>':'')+'</label>';
  });
  h+='</div>'+(o.live?'<p class="note" id="sheetlive" style="color:var(--ink);font-weight:500"></p>':'')+'<div class="btns">'+(o.onSave?'<button class="pri" data-act="sheet-save">'+(o.saveLabel||'保存')+'</button>':'')+'<button data-act="sheet-close">'+(o.onSave?'やめる':'閉じる')+'</button>'+(o.onDelete?'<button class="danger" data-act="sheet-del" style="margin-left:auto">削除</button>':'')+'</div></div>';
  var el=$('#sheet');el.innerHTML=h;el.hidden=false;
  if(o.live)$('#sheetlive').textContent=o.live(sheetRead());
}
function sheetRead(){
  var o=sheetCtx,out={};
  o.fields.forEach(function(f){var el=$('#f_'+f.k);
    out[f.k]=f.t==='chk'?el.checked:(f.t==='yen'||f.t==='int')?Math.round(toNum(el.value)):f.t==='dec'?toNum(el.value):(f.t==='ym'?(okYm(el.value)?el.value:o.value[f.k]):el.value.trim())});
  return out;
}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML='';sheetCtx=null}
function sheetSave(){
  var o=sheetCtx;
  o.onSave(sheetRead());closeSheet();save();render();
}

  L.push('## 道のり');
  state.ms.slice().sort(function(a,b){return ymN(a.ym)-ymN(b.ym)}).forEach(function(m){L.push('- '+ymL(m.ym)+'：'+m.label+(m.done?'【完了】':'')+(m.cost?'（支出 '+yen(m.cost)+'円）':''))});
  state.staff.forEach(function(s){if(s.on)L.push('- 開業'+s.start+'か月目：'+s.label+' 採用（月 '+yen(s.monthly)+'円）')});
  L.push('','## 資金','- 現在の貯蓄 '+yen(state.pre.savings)+'円／毎月の積立 '+yen(state.pre.monthly)+'円／賞与からの積立 年'+yen(state.pre.bonus)+'円',
    '- 開業費用 '+yen(C.openCost)+'円／月の固定費 '+yen(C.fixedBase)+'円',
    '- 必要な手元資金 '+yen(C.required)+'円（運転資金'+S.buffer+'か月）／開業時の見込み '+yen(C.funds+C.loan)+'円／過不足 '+yen(C.gap)+'円');
  L.push('','## 開業後の前提','- 顧問先 開始'+S.clients+'件・月'+S.growth+'件増／解約 年'+S.churn+'%／所長の担当上限 '+(S.ownerCap||'なし')+'件／新規獲得費 '+yen(S.acqCost)+'円/件／変動費 '+yen(varUnit(state))+'円/件・月／単価 '+yen(S.fee)+'円／決算料 年'+yen(S.kessan)+'円（'+(S.kessanMode==='avg'?'月割':'契約12か月目に一括')+'）／生活費 '+yen(S.living)+'円／国保年金 '+(S.kokuhoAuto?'所得から自動計算（退職前の年収 '+yen(S.prevSalary)+'円）':yen(S.kokuho)+'円'),
    '- 黒字が続く顧問先数（生活費・税金込み）：'+needClients(state,{staff:C.staffMAll,living:true})+'件／黒字が続き始める月：'+(C.stableM?'開業'+C.stableM+'か月目':C.N+'か月以内に届かず')+'／残高の底 '+yen(C.minBal)+'円／'+C.N+'か月目の残高 '+yen(C.rows[C.N-1].bal)+'円',
    '- 税金（'+C.N+'か月計）：消費税 '+yen(C.ctaxT)+'円／所得税・住民税・事業税 '+yen(C.itaxT)+'円（概算）');
  L.push('','※ △はマイナス。税金は概算。');
  return L.join('\n');
}

/* ---------- 操作 ---------- */
var resetArmed=0;
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]'); if(!t){if(ev.target.id==='sheet')closeSheet();return}
  var a=t.dataset.act,id=t.dataset.id;
  if(a==='toggle-ms'){var m=byId(state.ms,id);m.done=!m.done;save();refresh()}
  else if(a==='edit-ms')editMs(byId(state.ms,id));
  else if(a==='add-ms')editMs({id:uid(),label:'',ym:ymAdd(nowYm(),12),done:false,cost:0,note:'',kind:''},true);
  else if(a==='edit-oc')editItem('openCosts',byId(state.openCosts,id),false,'開業費用を編集');
  else if(a==='add-oc')editItem('openCosts',{id:uid(),g:'その他',label:'',amt:0,note:''},true,'開業費用に行を追加');
  else if(a==='edit-fx')editItem('fixed',byId(state.fixed,id),false,'固定費を編集');
  else if(a==='edit-vr')editItem('vars',byId(state.vars,id),false,'変動費を編集');
  else if(a==='add-vr')editItem('vars',{id:uid(),label:'',amt:0,note:''},true,'変動費に行を追加');
  else if(a==='add-fx')editItem('fixed',{id:uid(),g:'その他雑費',label:'',amt:0,note:'',pre:false},true,'固定費に行を追加');
  else if(a==='toggle-st'){ev.stopPropagation();var s=byId(state.staff,id);s.on=!s.on;save();refresh()}
  else if(a==='edit-st')editSt(byId(state.staff,id));
  else if(a==='add-st')editSt({id:uid(),label:'',on:true,start:13,salary:200000,bonusMonths:0,shaho:15,tools:10000,welfare:0,monthly:240000,init:180000,cap:0,note:''},true);
  else if(a==='sub'){afterSub=t.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='plv'){plView=t.dataset.v;render()}
  else if(a==='sheet-save')sheetSave();
  else if(a==='sheet-close')closeSheet();
  else if(a==='sheet-del'){sheetCtx.onDelete();closeSheet();save();render()}
  else if(a==='export'){
    try{var blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'}),l=document.createElement('a');
      l.href=URL.createObjectURL(blob);l.download='dokuritsu-plan-'+nowYm()+'.json';document.body.appendChild(l);l.click();l.remove();
      t.textContent='書き出しました';setTimeout(function(){if(t.isConnected)t.textContent='計画をファイルに書き出す'},2000)}catch(e){t.textContent='書き出せませんでした'}
  }
  else if(a==='import')$('#imp').click();
  else if(a==='sync-save'){
    var u=$('#syncurl').value.replace(/\s+/g,'').replace(/\/+$/,'').replace(/\/(mcp|api\/plan)$/,'');
    if(!/^https:\/\/[^\/]+\/[^\/]{20,}$/.test(u)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/[^\/]{20,}$/.test(u)){$('#syncstate').textContent='URLの形が違います。https://（ワーカーのアドレス）/（20文字以上の合言葉） の形で入れてください。';return}
    syncUrl=u;setBase(0);try{localStorage.setItem(SYNC_KEY,u)}catch(e){}
    render();pull();
  }
  else if(a==='sync-off'){syncUrl='';setBase(0);try{localStorage.removeItem(SYNC_KEY);localStorage.removeItem(BASE_KEY)}catch(e){}render();syncMsg('このブラウザに保存')}
  else if(a==='token'||a==='copy-mcp'){
    var val,ttl;
    if(a==='token'){var cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',rv=new Uint8Array(40);crypto.getRandomValues(rv);val=Array.prototype.map.call(rv,function(x){return cs[x%cs.length]}).join('');ttl='合言葉（Cloudflare の TOKEN に設定）'}
    else{val=syncUrl+'/mcp';ttl='Claude のコネクタに登録するURL'}
    var show=function(){openSheet({title:ttl,msg:'長押しでコピーできます。他人に見せないでください。',value:{txt:val},fields:[{k:'txt',l:'',t:'area'}]});var ta=$('#f_txt');ta.focus();ta.select()};
    if(a==='token')show();else{try{navigator.clipboard.writeText(val).then(function(){t.textContent='コピーしました';setTimeout(function(){if(t.isConnected)t.textContent='Claudeに登録するURLをコピー'},2000)},show)}catch(e){show()}}
  }
  else if(a==='copy'){
    var txt=handover(),done=function(){t.textContent='コピーしました';setTimeout(function(){t.textContent='計画を引き継ぎテキストとしてコピー'},2000)};
    var fb=function(){openSheet({title:'引き継ぎテキスト（長押しでコピー）',value:{txt:txt},fields:[{k:'txt',l:'',t:'area'}]});var ta=$('#f_txt');ta.focus();ta.select()};
    try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}
  }
  else if(a==='reset'){
    if(Date.now()-resetArmed<4000){state=defaults();resetArmed=0;save();render()}
    else{resetArmed=Date.now();t.textContent='もう一度押すと初期値に戻します';setTimeout(function(){if(t.isConnected)t.textContent='初期値に戻す'},4000)}
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&sheetCtx)closeSheet();
  if(ev.key==='Enter'&&ev.target.matches&&ev.target.matches('tr.tap,.tlb[data-act]'))ev.target.click();
});
function bound(ev){
  var el=ev.target,p=el.dataset&&el.dataset.b; if(!p)return;
  var k=p.split('.'),t=el.dataset.t,v;
  if(t==='chk')v=el.checked;else if(t==='str')v=el.value;else if(t==='sel')v=+el.value;else if(t==='dec')v=toNum(el.value);else if(t==='int')v=Math.max(0,Math.round(toNum(el.value)));else v=Math.round(toNum(el.value));
  state[k[0]][k[1]]=v;save();
  if(p==='sim.autoFunds')$('#fundsbox').hidden=v;
  if(p==='sim.kokuhoAuto'){render();return}
  refresh();
}
document.addEventListener('change',function(ev){
  if(ev.target.id!=='imp'||!ev.target.files[0]) return;
  var fr=new FileReader(),bad=function(){openSheet({title:'読み込めませんでした',msg:'このツールで書き出したファイル（dokuritsu-plan-….json）を選んでください。',value:{},fields:[]})};
  fr.onload=function(){
    var o;try{o=JSON.parse(fr.result)}catch(e){return bad()}
    if(!o||!Array.isArray(o.ms)||!o.sim||!Array.isArray(o.fixed)) return bad();
    openSheet({title:'この計画に置き換えますか',msg:'読み込むと、いま入力している計画は消えて、ファイルの内容に置き換わります。',saveLabel:'置き換える',value:{},fields:[],onSave:function(){state=migrate(o)}});
  };
  fr.onerror=bad;fr.readAsText(ev.target.files[0]);ev.target.value='';
});
document.addEventListener('input',function(ev){if(ev.target.id==='viewn'){viewN=Math.max(0,Math.round(toNum(ev.target.value)));refresh()}});
document.addEventListener('input',function(ev){if(sheetCtx&&sheetCtx.live&&ev.target.closest&&ev.target.closest('#sheet'))$('#sheetlive').textContent=sheetCtx.live(sheetRead())});
document.addEventListener('input',bound);
document.addEventListener('change',bound);
document.addEventListener('focusin',function(ev){var el=ev.target;if(el.dataset&&el.dataset.b&&el.type==='text'){el.value=String(toNum(el.value));el.select()}});
document.addEventListener('focusout',function(ev){var el=ev.target;if(el.dataset&&el.dataset.b&&el.type==='text'&&el.dataset.t==='yen')el.value=yen(toNum(el.value))});

function route(){var h=(location.hash||'').slice(1);tab=TABS.indexOf(h)>=0?h:'roadmap';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){route();if(syncUrl)pull()});
route();
pull();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&syncUrl&&!sheetCtx)pull()});
})();
</script>
</body></html>
